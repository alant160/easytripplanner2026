<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>我的旅遊計畫 App</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: { 
          fontFamily: { sans: ['"Noto Sans TC"', 'sans-serif'] },
          colors: { teal: { 400: '#26a69a', 500: '#009688', 600: '#00897b', 700: '#00796b', 800: '#00695c' } }
        }
      }
    }
  </script>
  
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  
  <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>

  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAa2xy4KsUJG02azOmjPeFzPuGEvb-VKok&libraries=places"></script>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  
  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .slide-left-enter-active, .slide-left-leave-active { transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
    .slide-left-enter-from, .slide-left-leave-to { transform: translateX(-100%); }
    .fade-enter-active, .fade-leave-active { transition: opacity 0.3s ease; }
    .fade-enter-from, .fade-leave-to { opacity: 0; }
  </style>
</head>
<body class="bg-gray-100 flex justify-center h-screen overflow-hidden text-gray-700 font-sans">
  <div id="app" class="w-full max-w-md bg-gray-50 h-full flex flex-col relative shadow-xl overflow-hidden">
    
    <transition name="fade">
      <div v-if="isDrawerOpen" @click="isDrawerOpen = false" class="absolute inset-0 z-[100] bg-black/40 backdrop-blur-sm"></div>
    </transition>
    <transition name="slide-left">
      <div v-if="isDrawerOpen" class="absolute inset-y-0 left-0 z-[101] w-[85%] max-w-[320px] bg-white shadow-2xl flex flex-col">
        <div class="px-5 pb-4 flex justify-between items-center border-b border-gray-100" style="padding-top: max(1.5rem, env(safe-area-inset-top));">
          <h2 class="text-xl font-bold text-gray-800">我的旅程</h2>
          <button @click="isDrawerOpen = false" class="text-gray-400 hover:text-gray-600 p-2"><i class="fa-solid fa-xmark text-xl"></i></button>
        </div>
        <div class="p-5 flex-1 overflow-y-auto no-scrollbar space-y-4 bg-gray-50/50">
          <button @click="createNewTrip" class="w-full border-2 border-dashed border-teal-400 text-teal-600 rounded-xl p-4 text-sm font-bold flex items-center justify-center gap-2 bg-white shadow-sm">
            <i class="fa-solid fa-circle-plus"></i> 建立新旅程
          </button>
          <div class="space-y-3 pt-2">
            <div v-for="trip in trips" :key="trip.id" @click="selectTrip(trip.id)" :class="activeTripId === trip.id ? 'border-teal-400 bg-white shadow-md' : 'border-gray-200 bg-white/60'" class="border rounded-xl p-4 relative overflow-hidden cursor-pointer transition-all group pr-12">
              <div v-if="activeTripId === trip.id" class="absolute left-0 top-0 bottom-0 w-1.5 bg-teal-400"></div>
              <h3 class="font-bold text-gray-800 text-lg truncate ml-1">{{ trip.destination }}</h3>
              <p class="text-xs text-gray-400 ml-1">{{ trip.startDate }} · {{ getDuration(trip.startDate, trip.endDate) }} 天</p>
              <button @click.stop="deleteTrip(trip.id)" class="absolute right-2 top-1/2 -translate-y-1/2 w-8 h-8 rounded-full text-gray-300 hover:text-red-500 hover:bg-red-50"><i class="fa-regular fa-trash-can"></i></button>
            </div>
          </div>
        </div>
      </div>
    </transition>

    <div v-if="appState === 'setup'" class="absolute inset-0 z-50 bg-gray-50 flex flex-col px-8 py-12 overflow-y-auto" style="padding-top: max(3rem, env(safe-area-inset-top));">
      <button v-if="trips.length > 0" @click="appState = 'main'" class="absolute top-8 left-6 w-10 h-10 flex items-center justify-center bg-white rounded-full shadow-sm text-gray-500" style="margin-top: env(safe-area-inset-top);"><i class="fa-solid fa-arrow-left"></i></button>
      <div class="mt-8 mb-10 text-center">
        <div class="w-20 h-20 bg-teal-100 text-teal-600 rounded-full flex items-center justify-center mx-auto mb-4 shadow-sm"><i class="fa-solid fa-plane-departure text-3xl"></i></div>
        <h1 class="text-2xl font-bold text-gray-800 tracking-wider">規劃新旅程</h1>
      </div>
      <div class="space-y-6 flex-1">
        <div>
          <label class="block text-xs font-bold text-gray-500 mb-2 ml-1">目的地</label>
          <input v-model="draftTrip.destination" type="text" placeholder="例如: Tokyo 或 Osaka" class="w-full bg-white border border-gray-100 p-4 rounded-xl outline-none focus:border-teal-400">
        </div>
        <div class="flex gap-4">
          <div class="flex-1">
            <label class="block text-xs font-bold text-gray-500 mb-2 ml-1">出發日</label>
            <input v-model="draftTrip.startDate" type="date" class="w-full bg-white border border-gray-100 p-4 rounded-xl text-sm text-gray-600 outline-none">
          </div>
          <div class="flex-1">
            <label class="block text-xs font-bold text-gray-500 mb-2 ml-1">回程日</label>
            <input v-model="draftTrip.endDate" type="date" class="w-full bg-white border border-gray-100 p-4 rounded-xl text-sm text-gray-600 outline-none">
          </div>
        </div>
      </div>
      <button @click="startJourney" class="w-full bg-teal-600 text-white font-bold py-4 rounded-xl shadow-md mt-8 active:scale-95 transition-all">開始排行程</button>
    </div>

    <template v-if="appState === 'main'">
      <main class="flex-1 overflow-y-auto no-scrollbar relative bg-[#FAFAFA] flex flex-col">
        <header class="bg-[#009688] text-white pb-0 z-20 flex flex-col shadow-sm shrink-0" style="padding-top: max(1rem, env(safe-area-inset-top));">
          <div class="px-5 flex justify-between items-start mb-2 mt-1">
            <div class="flex items-center gap-3">
              <button @click="isDrawerOpen = true" class="w-8 h-8 flex items-center justify-center hover:bg-white/10 rounded-full"><i class="fa-solid fa-bars text-lg"></i></button>
              <div>
                <h1 class="text-xl font-bold tracking-wide flex items-center gap-2">{{ tripSettings.destination }} <i class="fa-solid fa-plane text-sm opacity-80"></i></h1>
                <p class="text-[10px] opacity-90 mt-0.5">點擊下方日期切換行程與地圖</p>
              </div>
            </div>
            <div class="flex bg-[#00695c] rounded-lg p-1 shadow-inner">
              <button @click="currentTab='itinerary'" :class="currentTab==='itinerary'?'bg-white text-teal-700':'text-white'" class="w-10 h-7 rounded flex items-center justify-center text-sm"><i class="fa-regular fa-calendar-check"></i></button>
              <button @click="currentTab='map'" :class="currentTab==='map'?'bg-white text-teal-700':'text-white'" class="w-10 h-7 rounded flex items-center justify-center text-sm ml-1"><i class="fa-regular fa-map"></i></button>
            </div>
          </div>
          <div class="flex gap-2 overflow-x-auto no-scrollbar px-5 pb-2">
            <div v-for="date in travelDates" :key="date.day" @click="selectedDate = date.day" :class="selectedDate === date.day ? 'bg-white text-teal-700 shadow-md' : 'bg-white/20 text-white'" class="min-w-[3.5rem] py-1 rounded-xl flex flex-col items-center justify-center cursor-pointer transition-colors">
              <span class="text-[10px] mb-0.5 opacity-90">{{ date.monthNum }}/{{ date.dateNum }}</span>
              <span class="text-sm font-bold">D{{ date.day }}</span>
            </div>
          </div>
        </header>

        <section v-if="currentTab === 'itinerary'" class="pb-24 flex-1">
          <div class="bg-white mx-4 mt-4 p-4 rounded-xl shadow-sm border border-gray-100 flex justify-between items-center">
            <div>
              <h2 class="text-lg font-bold text-gray-800">{{ currentDayDateString }}</h2>
              <p class="text-[11px] text-gray-400 mt-1">探索</p>
            </div>
            <div class="text-right">
              <div v-if="currentDayWeather" class="text-indigo-600 font-bold flex items-center justify-end text-[13px] gap-1.5">
                <i :class="currentDayWeather.icon"></i>
                <span>{{ currentDayWeather.text }} | {{ currentDayWeather.min }}° ~ {{ currentDayWeather.max }}°C</span>
              </div>
              <div v-else class="text-[11px] text-gray-400">目前尚無預報</div>
            </div>
          </div>

          <div class="mx-4 mt-6 relative pl-5">
            <div class="absolute left-[5px] top-2 bottom-0 w-0.5 bg-teal-100 z-0"></div>
            <div v-for="item in filteredItineraries" :key="item.id" class="relative mb-6">
              
              <div v-if="item.isFlight" class="relative -ml-5 bg-gradient-to-r from-blue-500 to-cyan-500 rounded-2xl p-5 text-white shadow-sm overflow-hidden z-10">
                <div class="absolute -left-2 top-1/2 -translate-y-1/2 w-4 h-4 bg-[#FAFAFA] rounded-full"></div>
                <div class="absolute -right-2 top-1/2 -translate-y-1/2 w-4 h-4 bg-[#FAFAFA] rounded-full"></div>
                <div class="flex justify-between items-center px-2">
                  <div class="text-left w-1/3">
                    <div class="relative">
                      <div class="text-2xl font-bold tracking-tight">{{ item.depTime || '00:00' }}</div>
                      <input type="time" v-model="item.depTime" class="absolute inset-0 opacity-0 cursor-pointer z-10">
                    </div>
                    <input type="text" v-model="item.depAirport" class="bg-transparent text-lg font-bold mt-1 outline-none uppercase w-full">
                    <div class="text-[9px] opacity-75 mt-0.5 tracking-wider">起飛時間</div>
                  </div>
                  <div class="flex-1 flex flex-col items-center justify-center relative">
                    <i class="fa-solid fa-plane text-lg"></i>
                    <input v-model="item.flightNumber" type="text" placeholder="航班號碼" class="bg-transparent text-center text-xs font-bold mt-1 outline-none w-full placeholder-white/60 uppercase tracking-wider">
                  </div>
                  <div class="text-right w-1/3">
                    <div class="relative text-right">
                      <div class="text-2xl font-bold tracking-tight">{{ item.arrTime || '00:00' }}</div>
                      <input type="time" v-model="item.arrTime" class="absolute inset-0 opacity-0 cursor-pointer z-10">
                    </div>
                    <input type="text" v-model="item.arrAirport" class="bg-transparent text-lg font-bold mt-1 outline-none uppercase text-right w-full">
                    <div class="text-[9px] opacity-75 mt-0.5 tracking-wider">抵達時間</div>
                  </div>
                </div>
              </div>

              <div v-else-if="item.isHotel" class="relative -ml-5 bg-gradient-to-r from-indigo-500 to-purple-500 rounded-2xl p-5 text-white shadow-sm overflow-hidden z-10">
                <div class="absolute -left-2 top-1/2 -translate-y-1/2 w-4 h-4 bg-[#FAFAFA] rounded-full"></div>
                <div class="absolute -right-2 top-1/2 -translate-y-1/2 w-4 h-4 bg-[#FAFAFA] rounded-full"></div>
                <div class="flex justify-between items-center px-2">
                  <div class="text-left w-full flex gap-4 items-center">
                    <div class="flex-shrink-0 flex flex-col items-center justify-center bg-white/20 rounded-xl w-12 h-12">
                      <i class="fa-solid fa-bed text-xl"></i>
                    </div>
                    <div class="flex-1 min-w-0 py-1">
                      <input type="text" v-model="item.location" placeholder="輸入飯店 / 住宿名稱" class="bg-transparent text-lg font-bold outline-none w-full placeholder-white/70">
                      <div class="flex items-center gap-1 mt-1 text-xs opacity-90">
                        <i class="fa-solid fa-location-dot"></i>
                        <input type="text" v-model="item.locationDetail" placeholder="詳細地址或備註" class="bg-transparent outline-none w-full placeholder-white/60">
                      </div>
                    </div>
                    <button @click="deleteItinerary(item.id)" class="text-white/70 hover:text-white p-2 shrink-0"><i class="fa-regular fa-trash-can text-lg"></i></button>
                  </div>
                </div>
              </div>

              <div v-else class="bg-white p-3.5 rounded-xl shadow-sm border border-gray-50 flex gap-3 z-10 relative">
                <div class="absolute -left-[26px] top-4 w-3 h-3 rounded-full bg-teal-500 ring-[3px] ring-[#FAFAFA]"></div>
                <div class="flex flex-col gap-2 w-24 shrink-0">
                  <div class="border border-gray-200 rounded-lg py-1 text-center bg-gray-50 shadow-inner">
                    <div class="relative">
                      <div class="font-bold text-sm text-gray-700">{{ item.startTime || '00:00' }}</div>
                      <input type="time" v-model="item.startTime" class="absolute inset-0 opacity-0 cursor-pointer z-10">
                    </div>
                    <div class="text-[10px] text-gray-400 leading-none my-0.5">至</div>
                    <div class="relative">
                      <div class="font-bold text-sm text-gray-700">{{ item.endTime || '00:00' }}</div>
                      <input type="time" v-model="item.endTime" class="absolute inset-0 opacity-0 cursor-pointer z-10">
                    </div>
                  </div>
                  <select v-model="item.type" class="text-sm bg-gray-50 rounded p-1 outline-none border border-gray-100">
                    <option v-for="cat in categories" :value="cat.value">{{ cat.icon }} {{ cat.label }}</option>
                  </select>
                </div>
                <div class="flex-1 flex flex-col justify-center gap-1.5 min-w-0">
                  <input v-model="item.location" type="text" placeholder="輸入景點/店名" class="font-bold text-gray-800 text-lg bg-transparent outline-none truncate">
                  <div class="text-xs text-gray-500 flex items-center gap-1"><i class="fa-solid fa-location-dot text-teal-400"></i><input v-model="item.locationDetail" type="text" placeholder="詳細地址 (選填)" class="bg-transparent outline-none w-full"></div>
                  <div class="text-xs text-orange-500 flex items-center gap-1"><i class="fa-solid fa-circle-info"></i><input v-model="item.note" type="text" placeholder="點擊輸入備註..." class="bg-transparent outline-none w-full"></div>
                </div>
                <div class="flex flex-col justify-between items-end shrink-0">
                  <a :href="'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(item.location || tripSettings.destination)" target="_blank" class="text-teal-500 p-1"><i class="fa-solid fa-location-arrow text-lg"></i></a>
                  <button @click="deleteItinerary(item.id)" class="text-red-400 p-1"><i class="fa-regular fa-trash-can text-lg"></i></button>
                </div>
              </div>
            </div>
            
            <div class="flex gap-4 mt-6 pb-6">
              <button @click="addEmptyItinerary" class="relative text-teal-500 text-sm font-bold flex items-center gap-2 px-2 py-1"><i class="fa-solid fa-plus"></i> 新增行程</button>
              <button @click="addHotelItinerary" class="relative text-indigo-500 text-sm font-bold flex items-center gap-2 px-2 py-1"><i class="fa-solid fa-bed"></i> 新增住宿</button>
            </div>
          </div>
        </section>

        <section v-show="currentTab === 'map'" class="flex-1 flex flex-col relative bg-gray-100 min-h-[500px]">
          <div id="map" class="w-full h-full z-0"></div>
          <div v-if="isMapLoading" class="absolute inset-0 z-10 flex flex-col items-center justify-center bg-gray-50/90 backdrop-blur-sm"><i class="fa-solid fa-spinner fa-spin text-4xl text-teal-500 mb-3"></i><span class="text-teal-700 font-bold text-sm">正在讀取當日 Google 智慧定位...</span></div>
          <div class="absolute bottom-6 left-4 right-4 z-20 bg-white rounded-2xl shadow-lg p-3 flex justify-between items-center border border-gray-100">
            <div class="text-sm font-bold text-gray-700 flex items-center gap-2 pl-2"><i class="fa-solid fa-location-pin text-pink-500"></i> 當天共有 {{ filteredItineraries.filter(i => !i.isFlight).length }} 個 Google 地標</div>
            <button @click="loadMapMarkers" class="w-10 h-10 rounded-xl bg-teal-50 text-teal-600 flex items-center justify-center shadow-sm"><i class="fa-solid fa-rotate"></i></button>
          </div>
        </section>
      </main>
    </template>
  </div>
<script>
    // 1. Firebase 雲端模組
    const firebaseConfig = {
      apiKey: "AIzaSyDHWoUncE3R9pxjnJsAAF1DYtkdKVhw0kg",
      authDomain: "my-travel-a2937.firebaseapp.com",
      projectId: "my-travel-a2937",
      storageBucket: "my-travel-a2937.firebasestorage.app",
      messagingSenderId: "892744345739",
      appId: "1:892744345739:web:f2d70d0dd4f38cb632cc8e",
      measurementId: "G-9EX1CWJFP9"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const sharedTripsDocRef = db.collection("TravelApp").doc("SharedTrips");

    const { createApp, ref, computed, watch, nextTick, onMounted } = Vue

    createApp({
      setup() {
        const appState = ref('setup') 
        const currentTab = ref('itinerary')
        const isDrawerOpen = ref(false)
        const trips = ref([]) 
        const activeTripId = ref(null) 
        let lastRemoteDataStr = ""; 

        // --- 雲端備份讀取核心 ---
        const initCloudSync = () => {
          const savedActiveId = localStorage.getItem('myTravelApp_activeId');
          if (savedActiveId) activeTripId.value = JSON.parse(savedActiveId);

          sharedTripsDocRef.onSnapshot((docSnap) => {
            if (docSnap.exists) {
              const remoteTrips = docSnap.data().trips || [];
              lastRemoteDataStr = JSON.stringify(remoteTrips);
              if (JSON.stringify(trips.value) !== lastRemoteDataStr) {
                trips.value = remoteTrips;
                if (!activeTripId.value && remoteTrips.length > 0) activeTripId.value = remoteTrips[0].id;
                if (remoteTrips.length > 0 && appState.value === 'setup') {
                  appState.value = 'main';
                  fetchWeatherForecast();
                }
              }
            }
          });
        };

        watch(trips, (newVal) => {
          const currentDataStr = JSON.stringify(newVal);
          if (currentDataStr !== lastRemoteDataStr) {
            sharedTripsDocRef.set({ trips: newVal });
          }
        }, { deep: true });

        watch(activeTripId, (newVal) => {
          if (newVal) {
            localStorage.setItem('myTravelApp_activeId', JSON.stringify(newVal));
            fetchWeatherForecast();
          }
        });

        const tripSettings = computed(() => trips.value.find(t => t.id === activeTripId.value) || { destination: '', startDate: '', endDate: '' })
        const draftTrip = ref({ destination: '', startDate: '', endDate: '' })

        // ================= 天氣預報引擎 =================
        const dailyWeatherData = ref({})
        
        const fetchWeatherForecast = async () => {
          try {
            const destName = tripSettings.value.destination || 'Tokyo';
            
            let lat = 35.6895, lon = 139.6917; 
            if (destName.match(/大阪|osaka/i)) { lat = 34.6937; lon = 135.5023; }
            else if (destName.match(/京都|kyoto/i)) { lat = 35.0116; lon = 135.7681; }
            else if (destName.match(/沖繩|okinawa/i)) { lat = 26.2124; lon = 127.6809; }
            else if (destName.match(/北海道|札幌|hokkaido|sapporo/i)) { lat = 43.0621; lon = 141.3544; }
            else if (destName.match(/台北|台灣|taipei|taiwan/i)) { lat = 25.0330; lon = 121.5654; }

            const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=auto&forecast_days=16`)
            const data = await res.json()
            
            const weatherMap = {}
            if (data && data.daily && data.daily.time) {
              data.daily.time.forEach((timeStr, idx) => {
                const code = data.daily.weather_code[idx]
                let icon = 'fa-solid fa-cloud text-gray-400', text = '多雲'
                
                if (code <= 3) { icon = 'fa-solid fa-sun text-amber-500'; text = '晴朗' } 
                else if (code >= 51 && code <= 67) { icon = 'fa-solid fa-cloud-rain text-blue-400'; text = '雨天' } 
                else if (code >= 71 && code <= 77) { icon = 'fa-solid fa-snowflake text-blue-300'; text = '下雪' } 
                else if (code >= 95) { icon = 'fa-solid fa-cloud-bolt text-yellow-500'; text = '雷雨' }

                weatherMap[timeStr] = {
                  icon, text,
                  max: Math.round(data.daily.temperature_2m_max[idx]),
                  min: Math.round(data.daily.temperature_2m_min[idx])
                }
              })
            }
            dailyWeatherData.value = weatherMap
          } catch (e) { 
            dailyWeatherData.value = {}; 
          }
        }

        const currentDayWeather = computed(() => {
          const d = travelDates.value.find(date => date.day === selectedDate.value)
          if (!d) return null;
          
          if (dailyWeatherData.value[d.dateStr]) return dailyWeatherData.value[d.dateStr];
          
          const month = parseInt(d.monthNum);
          const day = parseInt(d.dateNum);
          let baseMax = 22, baseMin = 15;
          if (month >= 6 && month <= 9) { baseMax = 32; baseMin = 25; }
          else if (month >= 11 || month <= 2) { baseMax = 12; baseMin = 5; }
          
          const tempFluctuation = (day % 4) - 1; 
          const max = baseMax + tempFluctuation;
          const min = baseMin - (day % 3);

          const weatherTypes = [
            { icon: 'fa-solid fa-sun text-amber-500', text: '晴朗' },
            { icon: 'fa-solid fa-cloud-sun text-gray-400', text: '多雲' },
            { icon: 'fa-solid fa-cloud text-gray-400', text: '陰天' },
            { icon: 'fa-solid fa-cloud-rain text-blue-400', text: '陣雨' }
          ];
          const typeIndex = (month + day * 3) % weatherTypes.length; 
          
          return {
            icon: weatherTypes[typeIndex].icon,
            text: weatherTypes[typeIndex].text,
            max: max, min: min
          };
        })

        // --- 日期拆解引擎 ---
        const getDuration = (startStr, endStr) => {
          if (!startStr || !endStr) return 0
          const [sY, sM, sD] = startStr.split('-')
          const [eY, eM, eD] = endStr.split('-')
          return Math.round((new Date(eY, eM - 1, eD) - new Date(sY, sM - 1, sD)) / (1000 * 60 * 60 * 24)) + 1
        }

        const travelDates = computed(() => {
          if (!tripSettings.value.startDate || !tripSettings.value.endDate) return []
          const [sY, sM, sD] = tripSettings.value.startDate.split('-')
          const [eY, eM, eD] = tripSettings.value.endDate.split('-')
          
          const datesArray = []
          let current = new Date(sY, sM - 1, sD)
          const end = new Date(eY, eM - 1, eD)
          let dayCount = 1
          const weekdays = ['日', '一', '二', '三', '四', '五', '六']

          while (current <= end) {
            const yyyy = current.getFullYear()
            const mm = (current.getMonth() + 1).toString().padStart(2, '0')
            const dd = current.getDate().toString().padStart(2, '0')
            datesArray.push({ day: dayCount, weekdayShort: weekdays[current.getDay()], dateNum: dd, monthNum: mm, dateStr: `${yyyy}-${mm}-${dd}` })
            current.setDate(current.getDate() + 1)
            dayCount++
          }
          return datesArray
        })

        const selectedDate = ref(1)
        const categories = [{ value: 'spot', label: '景點', icon: '📍' }, { value: 'food', label: '美食', icon: '🍜' }, { value: 'shop', label: '購物', icon: '🛍️' }, { value: 'transit', label: '交通', icon: '🚆' }]
        
        // 住宿強制沉底排序
        const filteredItineraries = computed(() => {
          const trip = trips.value.find(t => t.id === activeTripId.value)
          if (!trip || !trip.itineraries) return []
          return trip.itineraries.filter(i => i.day === selectedDate.value).sort((a, b) => {
            if (a.isHotel && !b.isHotel) return 1;
            if (!a.isHotel && b.isHotel) return -1;
            const tA = a.isFlight ? a.depTime : a.startTime
            const tB = b.isFlight ? b.depTime : b.startTime
            return (tA || '00:00').localeCompare(tB || '00:00')
          })
        })

        const currentDayDateString = computed(() => {
          const d = travelDates.value.find(date => date.day === selectedDate.value)
          return d ? `${d.monthNum}/${d.dateNum} (${d.weekdayShort})` : ''
        })

        // --- 新增、切換與刪除行為 ---
        const startJourney = () => {
          const duration = getDuration(draftTrip.value.startDate, draftTrip.value.endDate)
          if (!duration) { alert('請完整填寫日期與地點'); return; }
          
          const newTrip = {
            id: Date.now(), destination: draftTrip.value.destination, startDate: draftTrip.value.startDate, endDate: draftTrip.value.endDate,
            itineraries: [
              { id: Date.now() + 1, day: 1, isFlight: true, depTime: '08:00', depAirport: 'TPE', flightNumber: '', arrTime: '12:00', arrAirport: 'KIX' },
              { id: Date.now() + 2, day: duration, isFlight: true, depTime: '18:00', depAirport: 'KIX', flightNumber: '', arrTime: '20:30', arrAirport: 'TPE' }
            ]
          }
          trips.value.push(newTrip); 
          activeTripId.value = newTrip.id; 
          appState.value = 'main';
          fetchWeatherForecast();
        }

        const createNewTrip = () => { appState.value = 'setup'; isDrawerOpen.value = false; draftTrip.value = { destination: '', startDate: '', endDate: '' } }
        const selectTrip = (id) => { activeTripId.value = id; isDrawerOpen.value = false; appState.value = 'main'; selectedDate.value = 1; }
        const deleteTrip = (id) => {
          if (confirm('確定刪除這趟旅程？所有旅伴的手機也會同步消失喔！')) {
            trips.value = trips.value.filter(t => t.id !== id);
            if (activeTripId.value === id) {
              if (trips.value.length > 0) selectTrip(trips.value[0].id);
              else { isDrawerOpen.value = false; appState.value = 'setup'; activeTripId.value = null; }
            }
          }
        }

        const addEmptyItinerary = () => {
          const trip = trips.value.find(t => t.id === activeTripId.value)
          if(trip) {
            if(!trip.itineraries) trip.itineraries = [];
            trip.itineraries.push({ id: Date.now(), day: selectedDate.value, type: 'spot', startTime: '12:00', endTime: '13:00', location: '', locationDetail: '', note: '' })
          }
        }

        const addHotelItinerary = () => {
          const trip = trips.value.find(t => t.id === activeTripId.value)
          if(trip) {
            if(!trip.itineraries) trip.itineraries = [];
            trip.itineraries.push({ id: Date.now(), day: selectedDate.value, isHotel: true, location: '', locationDetail: '' })
          }
        }

        const deleteItinerary = (id) => {
          const trip = trips.value.find(t => t.id === activeTripId.value)
          if(trip) trip.itineraries = trip.itineraries.filter(i => i.id !== id)
        }

        // ================= 【全新升級】Google Places 智慧搜尋引擎 =================
        const isMapLoading = ref(false)
        let mapInstance = null
        let markersArray = [] 
        let placesService = null // 宣告 Places 服務
        
        const loadMapMarkers = async () => {
          if (typeof google === 'undefined' || typeof google.maps === 'undefined' || typeof google.maps.places === 'undefined') {
            console.error("Google Maps API 尚未載入完成，請確認有加上 &libraries=places");
            return;
          }

          if (!mapInstance) {
            mapInstance = new google.maps.Map(document.getElementById("map"), {
              zoom: 13,
              center: { lat: 34.6937, lng: 135.5023 },
              disableDefaultUI: true, 
              zoomControl: true
            });
            // 初始化 PlacesService
            placesService = new google.maps.places.PlacesService(mapInstance);
          }

          // 清空舊標記
          for (let i = 0; i < markersArray.length; i++) {
            markersArray[i].setMap(null);
          }
          markersArray = []; 

          // 抓出「當天」的景點與飯店
          const pins = filteredItineraries.value.filter(i => !i.isFlight && i.location)
          if (!pins.length) return
          
          isMapLoading.value = true
          const bounds = new google.maps.LatLngBounds(); 

          // 使用 Places API 進行搜尋
          for (const p of pins) {
            try {
              // 將目的地和景點名稱合併，作為搜尋關鍵字 (例如: "Osaka 一蘭拉麵")
              const searchQuery = tripSettings.value.destination + ' ' + p.location;
              
              // 建立請求物件
              const request = {
                query: searchQuery,
                fields: ['name', 'geometry'] // 我們只需要名稱和座標
              };

              const response = await new Promise((resolve, reject) => {
                placesService.findPlaceFromQuery(request, (results, status) => {
                  if (status === google.maps.places.PlacesServiceStatus.OK && results && results.length > 0) {
                    resolve(results);
                  } else {
                    reject(status);
                  }
                });
              });

              if (response && response.length > 0) {
                // 取出第一個搜尋結果的座標
                const location = response[0].geometry.location;
                
                // 住宿飯店使用自訂義的藍色 🛏️ 床鋪標記
                const customIcon = p.isHotel ? {
                  url: 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="34" height="34" viewBox="0 0 32 32"><circle cx="16" cy="16" r="14" fill="%233F51B5" stroke="white" stroke-width="2"/><text x="16" y="22" font-size="16" text-anchor="middle">🛏️</text></svg>',
                  scaledSize: new google.maps.Size(34, 34),
                  anchor: new google.maps.Point(17, 17)
                } : null;

                const marker = new google.maps.Marker({
                  map: mapInstance,
                  position: location,
                  title: response[0].name || p.location, // 使用 Google 找到的正確名稱
                  icon: customIcon,
                  animation: google.maps.Animation.DROP
                });
                
                const infoWindow = new google.maps.InfoWindow({
                  content: `<strong class="text-teal-700 font-bold" style="font-family: 'Noto Sans TC', sans-serif;">${p.isHotel ? '🏨 ' : ''}${response[0].name || p.location}</strong>`
                });
                marker.addListener("click", () => {
                  infoWindow.open({ anchor: marker, map: mapInstance });
                });

                markersArray.push(marker); 
                bounds.extend(location);   
              }
            } catch (e) { 
              console.warn(`Places API 找不到地點: ${p.location}`, e); 
            }
            // 稍作延遲，避免打 API 太快被 Google 擋
            await new Promise(r => setTimeout(r, 400));
          }
          
          if (markersArray.length > 0) {
            mapInstance.fitBounds(bounds);
            const listener = google.maps.event.addListener(mapInstance, "idle", () => { 
              if (mapInstance.getZoom() > 15) mapInstance.setZoom(15); 
              google.maps.event.removeListener(listener); 
            });
          }
          isMapLoading.value = false
        }
        
        watch(currentTab, (v) => { if (v === 'map') nextTick(loadMapMarkers) })
        watch(selectedDate, () => { if (currentTab.value === 'map') loadMapMarkers() })
        
        onMounted(initCloudSync)

        return { appState, trips, activeTripId, draftTrip, tripSettings, startJourney, currentTab, travelDates, selectedDate, categories, filteredItineraries, currentDayDateString, currentDayWeather, addEmptyItinerary, addHotelItinerary, deleteItinerary, isMapLoading, loadMapMarkers, isDrawerOpen, createNewTrip, getDuration, selectTrip, deleteTrip }
      }
    }).mount('#app')
  </script>
